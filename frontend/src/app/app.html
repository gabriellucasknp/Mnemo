<div class="layout">
  <aside class="sidebar">
    <a class="logo" routerLink="/">
      <span class="logo-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#FFB020"/>
        </svg>
      </span>
      <span class="logo-name">Mnemo</span>
    </a>

    <nav class="nav">
      <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M3 12L12 3l9 9" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 10v10a1 1 0 001 1h12a1 1 0 001-1V10" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Início
      </a>
      <a class="nav-item" routerLink="/nova-aula" routerLinkActive="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 15V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V16" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
        </svg>
        Nova aula
      </a>
      <a class="nav-item" routerLink="/aulas" routerLinkActive="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="13" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M3 9H21" stroke="currentColor" stroke-width="2"/>
        </svg>
        Meus decks
      </a>
      <a class="nav-item" routerLink="/simulados" routerLinkActive="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Simulados
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="avatar">MN</span>
      <span class="sidebar-footer-text">Mnemo · MVP</span>
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
