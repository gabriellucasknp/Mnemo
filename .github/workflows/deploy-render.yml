# ============================================================
# Deploy no Render (gatilho manual ou push em main).
#
# O Render constrói a imagem a partir do repositório (render.yaml,
# runtime docker) — este workflow NÃO precisa fazer build/push de
# imagem; ele só valida o ambiente e dispara o deploy:
#
#   1. Falha cedo se algum secret obrigatório não existir no GitHub
#      (Settings -> Secrets and variables -> Actions).
#   2. Dispara o deploy via:
#        a) Deploy Hook do Render (recomendado), OU
#        b) API do Render (RENDER_API_KEY + RENDER_SERVICE_ID).
#
# Secrets necessários no GitHub:
#   GEMINI_API_KEY        chave do Google AI Studio (o app usa)
#   DATABASE_URL          connection string do Postgres do Render
#   ADMIN_TOKEN           token de admin (reservado)
#   RENDER_DEPLOY_HOOK    hook de deploy do Render (recomendado)
#   RENDER_API_KEY        alternativa ao hook (API do Render)
#   RENDER_SERVICE_ID     id do serviço web no Render
# ============================================================

name: Deploy Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets obrigatórios
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          FALTANDO=()
          [ -z "$GEMINI_API_KEY" ] && FALTANDO+=("GEMINI_API_KEY")
          [ -z "$DATABASE_URL" ] && FALTANDO+=("DATABASE_URL")
          [ -z "$ADMIN_TOKEN" ] && FALTANDO+=("ADMIN_TOKEN")
          if [ ${#FALTANDO[@]} -gt 0 ]; then
            echo "::error::Secrets ausentes no GitHub: ${FALTANDO[*]}"
            echo ""
            echo "Crie-os em: Settings -> Secrets and variables -> Actions"
            echo "  - GEMINI_API_KEY  -> Google AI Studio (genai.google.com)"
            echo "  - DATABASE_URL    -> connection string do Postgres (Render Databases)"
            echo "  - ADMIN_TOKEN     -> token de admin (reservado, pode ser um valor aleatório)"
            exit 1
          fi
          echo "Secrets obrigatórios OK: GEMINI_API_KEY, DATABASE_URL, ADMIN_TOKEN"

      - name: Deploy via Render Deploy Hook
        if: secrets.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Disparando deploy no Render via hook..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: Deploy via Render API
        if: secrets.RENDER_DEPLOY_HOOK == '' && secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Disparando deploy no Render via API (service $RENDER_SERVICE_ID)..."
          curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -d '{"clearCache": "do_not_clear"}'
