name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: API/requirements-base.txt

      # Só dependências base: os testes mockam o Whisper e a IA, então
      # o job roda sem torch/openai-whisper/ffmpeg — rápido e previsível.
      - name: Instalar dependências base
        working-directory: API
        run: |
          pip install --upgrade pip "setuptools<71" wheel
          pip install -r requirements-base.txt

      - name: Rodar testes
        working-directory: API
        run: python -m pytest tests -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Build de produção
        working-directory: frontend
        run: npm run build -- --configuration production

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit "setuptools<71"
          pip-audit -r API/requirements-base.txt --skip-editable
