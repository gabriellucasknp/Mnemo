name: CI

# push restrito a main: sem isso, PRs de branch interna rodam tudo em dobro
# (uma execução pelo push, outra pelo pull_request).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: API/requirements.txt

      - name: Instalar dependências
        working-directory: API
        run: |
          pip install --upgrade pip "setuptools<71" wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation -r requirements.txt

      - name: Rodar testes
        working-directory: API
        run: python -m pytest tests -v --tb=short

  # Sem continue-on-error: auditoria que nunca falha o build é decorativa.
  # Vulnerabilidade conhecida e aceita? Use --ignore-vuln <ID> documentado.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        working-directory: API
        run: |
          pip install pip-audit "setuptools<71" wheel
          pip-audit -r requirements.txt --skip-editable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production
