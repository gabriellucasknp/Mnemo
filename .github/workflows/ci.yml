name: CI

# push restrito a main: sem isso, PRs de branch interna rodam tudo em dobro
# (uma execução pelo push, outra pelo pull_request).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: API/requirements.txt

      - name: Instalar dependências
        working-directory: API
        run: |
          pip install --upgrade pip "setuptools<71" wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation -r requirements.txt

      - name: Rodar testes
        working-directory: API
        run: python -m pytest tests -v --tb=short

  # Sem continue-on-error: auditoria que nunca falha o build é decorativa.
  # Vulnerabilidade conhecida e aceita? Use --ignore-vuln <ID> documentado.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: API/requirements.txt

      # Instala como o job de testes e audita o ambiente RESOLVIDO, não o
      # requirements.txt cru: o modo `-r` builda o sdist do openai-whisper num
      # venv isolado (setuptools novo, sem pkg_resources) e quebra antes de
      # auditar qualquer coisa. Auditar o ambiente também cobre as transitivas
      # (foi assim que o starlette vulnerável passou batido).
      - name: Instalar dependências
        working-directory: API
        run: |
          pip install --upgrade pip "setuptools<71" wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation -r requirements.txt

      - name: pip-audit
        working-directory: API
        run: |
          # setuptools volta pro mais novo: o <71 só era necessário durante o
          # build do whisper e a versão antiga tem CVE conhecido (seria flagrada).
          pip install --upgrade pip setuptools pip-audit
          pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production
